name: public-data-pilot
profile: pilot
seed: 42
strategy: structural
outer_folds: 3
inner_folds: 2
trials: 1
seeds: [42]
minimum_positive_labels: 20
bootstrap_repeats: 100
organisers: [mean, stacking, gating]
models:
  - {name: descriptor_linear, family: classical, estimator: linear, features: descriptors, alpha: 10.0, C: 0.1}
  - {name: fingerprint_rf, family: classical, estimator: rf, features: morgan, n_estimators: 120, min_samples_leaf: 2}
  - {name: fingerprint_xgb, family: classical, estimator: xgb, features: morgan, n_estimators: 100, max_depth: 4}
  - {name: stereo_dmpnn, family: graph, width: 128, depth: 3, dropout: 0.1, epochs: 15, batch_size: 64, learning_rate: 0.001}
  - {name: tanimoto_gp, family: classical, estimator: gp, features: morgan, task: regression}

